[build-system]
requires = ["setuptools>=61.0", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "decimal-computer"
version = "0.1.0"
description = "Prototype decimal computer with digit-level GEMM and adaptive algorithm selection"
requires-python = ">=3.10"

authors = [
    { name = "Karan Singh" }
]

# SPDX short identifier string (not a table)
license = "MIT"
# optionally:
# license-files = ["LICENSE"]

# Core runtime dependencies
dependencies = [
    "numpy",
]

[project.optional-dependencies]
gmp = ["gmpy2"]
plot = ["matplotlib"]

[project.scripts]
decimal-computer = "decimal_computer.cli:main"
